; nRF52840 SuperMini BTHome v2 sensor (BME280 + internal VDD)
; SDA = P0.17 (17), SCL = P0.20 (20), sensor power = P1.00 (32), LDO kill = P0.13 (13)
; Board: pca10056 Adafruit-core variant -> identity pin map, runs BTLDR adafruit (UF2)
[env:supermini]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BME280 Library@^2.3.0
extra_scripts = scripts/elf2uf2.py