[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
    olikraus/U8g2
    adafruit/Adafruit Si7021 Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson
board_build.filesystem = littlefs
monitor_speed = 115200

[env:d1_mini_ota]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
    ${env:d1_mini.lib_deps}
board_build.filesystem = littlefs
upload_protocol = espota
upload_port = 192.168.1.XXX
; Használat: pio run -e d1_mini_ota -t upload
; Vagy curl: curl -F "file=@.pio/build/d1_mini/firmware.bin" http://DEVICE_IP/update
